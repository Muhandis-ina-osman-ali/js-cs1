    <script>
        class emp{
            constructor(id,name){
                this.id=id;

            detail(){
               document.write(this.id +" " +this.name+"<br> ");
                //document.write(this.id +" "+this.name+"<br>");
            }
        }
        var e1=new emp (101, "haliima");
        var e2 = new emp (102, "sacdiyo");
        e1.detail();
        e2.detail();
    </script>
