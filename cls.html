<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Emp
        {
            constructor(id,name)
            {
                this.id = id;
                this.name = name;
            }
            detail()
            {
                document.write(this.id +" "+this.name+"<br>");
            }
        }
        var e1 = new Emp(101,"Halimo");
        var e2 = new Emp(102,"Batulo");
        e1.detail();
        e2.detail();

    </script>
</body>
</html>
