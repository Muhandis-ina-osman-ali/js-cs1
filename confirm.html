<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function msg()
        {
            var v = confirm("Are you sure");
            if(v == true)
            {
                alert("Ok");
            }
            else{
                alert("Cancel");
            }
        }
    </script>
    <input type="button" value="Click me" onclick="msg()"/>
</body>
</html>
