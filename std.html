<body>

    <script> 
        function pass()
        {
            var name = document.form1.txt.value;

            document.write("Welcome: "+name);
            /*alert("Welcome: "+name + " \n Age: "+Age); */
            alert("welcome: "+name + " \n age: "+Age);
        }
        
    </script>
  
   
    <form name="form1">
       Enter Your Name: <input type="text" name="txt"/><br><br>
       Enter Your Age: <input type="text" name="age"/><br><br>
        <input type="button" value="Click" onclick="pass()"/>
     
    </form>
